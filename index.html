<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kasantara Studio — W.I.P.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Handjet:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    :root {
      --bg-blue-dark: #165c94;
      --blue-light: #8cc8e8;
      --ink-dark: #1d1f23;
      --pure-white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Handjet', sans-serif;
      background-color: var(--bg-blue-dark);
      color: var(--pure-white);
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-blue-dark);
    }

    .bg-figma-texture {
      position: absolute;
      inset: -2%;
      width: 104%;
      height: 104%;
      background-color: var(--bg-blue-dark);
      background-image: url('assets/bg.svg');
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 1;
      pointer-events: none;
      will-change: transform;
    }

    .scene-geometry {
      position: absolute;
      inset: -1.5%;
      width: 103%;
      height: 103%;
      display: block;
      z-index: 2;
      pointer-events: none;
      will-change: transform;
    }

    .film-frame {
      pointer-events: auto;
      cursor: pointer;
      transform-box: fill-box;
      transform-origin: center;
    }

    .film-frame-rect {
      transition: fill 0.15s ease;
    }

    .film-frame:hover .film-frame-rect {
      fill: #e8f6ff;
    }

    .film-tag {
      font-family: 'Handjet', sans-serif;
      font-size: 23px;
      font-weight: 600;
      fill: var(--ink-dark);
      letter-spacing: 0.08em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .film-frame:hover .film-tag {
      opacity: 1;
    }

    .foreground-layer {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      will-change: transform;
    }

    .interactive {
      pointer-events: auto;
    }

    .asset-logo {
      position: absolute;
      top: 2.5%;
      left: 3.9%;
      width: min(6.6vw, 9.2vh);
      height: auto;
      z-index: 6;
      cursor: pointer;
    }

    .asset-aksara {
      position: absolute;
      top: 5.2%;
      right: 6.5%;
      width: min(3.1vw, 4.4vh);
      height: auto;
      z-index: 6;
    }

    .asset-barcode {
      position: absolute;
      bottom: 2.1%;
      left: 1.6%;
      width: min(17.5vw, 24.5vh);
      height: auto;
      z-index: 6;
      cursor: pointer;
    }

    .brand-angled {
      position: absolute;
      left: -1.6%;
      top: 53.5%;
      font-size: clamp(1.8rem, min(4.35vw, 6.1vh), 6rem);
      font-weight: 400;
      letter-spacing: 0.14em;
      line-height: 1;
      transform: rotate(56deg);
      transform-origin: center;
      user-select: none;
      white-space: nowrap;
    }

    .hero-title {
      position: absolute;
      left: 16.2%;
      top: 24.8%;
      display: flex;
      font-size: clamp(5.5rem, min(17.6vw, 24.8vh), 22rem);
      font-weight: 400;
      line-height: 0.88;
      letter-spacing: 0.035em;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .hero-char {
      display: inline-block;
      will-change: transform;
    }

    .hero-subtitle {
      position: absolute;
      left: 31.6%;
      top: 50.2%;
      font-size: clamp(1.6rem, min(4.3vw, 6.05vh), 5.6rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.075em;
      user-select: none;
      white-space: nowrap;
    }


    .kinetic-marquee {
      position: absolute;
      left: 31.8%;
      top: 60.4%;
      width: clamp(230px, 29vw, 450px);
      height: clamp(26px, 3.2vh, 38px);
      background-color: var(--ink-dark);
      border: 2px solid var(--pure-white);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      z-index: 5;
      user-select: none;
    }

    .marquee-track {
      display: flex;
      width: max-content;
      will-change: transform;
    }

    .marquee-item {
      font-size: clamp(0.95rem, 1.35vw, 1.35rem);
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--pure-white);
      padding-right: 1.5rem;
      white-space: nowrap;
    }

    .marquee-accent {
      color: var(--blue-light);
    }

    .build-status {
      position: absolute;
      left: 31.8%;
      top: 65.4%;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: clamp(0.85rem, 1.15vw, 1.2rem);
      letter-spacing: 0.12em;
      color: var(--bg-blue-dark);
      font-weight: 600;
      user-select: none;
    }

    .build-bar-outer {
      width: clamp(110px, 13vw, 200px);
      height: 8px;
      border: 1.5px solid var(--bg-blue-dark);
      background: rgba(255, 255, 255, 0.45);
      padding: 1px;
    }

    .build-bar-fill {
      width: 30%;
      height: 100%;
      background-color: var(--bg-blue-dark);
      transform-origin: left;
    }

    .loop-gyro {
      position: absolute;
      left: 44.5%;
      top: 71.8%;
      width: clamp(44px, 4.6vw, 68px);
      height: clamp(44px, 4.6vw, 68px);
      z-index: 5;
      pointer-events: none;
    }

    .loop-chevrons {
      position: absolute;
      left: 20.5%;
      top: 63.5%;
      transform: rotate(51deg);
      display: flex;
      gap: 6px;
      z-index: 5;
      pointer-events: none;
    }

    .signal-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 3px;
      height: 13px;
      margin-right: 6px;
    }

    .signal-bar {
      width: 3px;
      height: 100%;
      background-color: var(--pure-white);
      transform-origin: bottom;
    }


    .contact-info {
      position: absolute;
      left: 72.2%;
      top: 72.8%;
      font-size: clamp(0.75rem, min(1.06vw, 1.48vh), 1.38rem);
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: 0.075em;
      text-transform: uppercase;
      white-space: nowrap;
      z-index: 6;
    }

    .contact-header {
      display: flex;
      align-items: center;
      margin-bottom: 3px;
    }

    .contact-wa-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 7px;
    }

    .social-dock {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .hud-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--pure-white);
      text-decoration: none;
      padding: 2px 8px;
      background-color: var(--ink-dark);
      border: 1.5px solid var(--pure-white);
      border-radius: 3px;
      font-weight: 500;
      letter-spacing: 0.08em;
      transition: background-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
    }

    .hud-btn svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .hud-btn:hover {
      background-color: var(--pure-white);
      color: var(--ink-dark);
      transform: translateY(-2px);
    }


    .tactical-reticle {
      position: fixed;
      top: 0;
      left: 0;
      width: 32px;
      height: 32px;
      pointer-events: none;
      z-index: 50;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: width 0.2s ease, height 0.2s ease, opacity 0.2s ease;
    }

    .tactical-reticle::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 2px solid var(--pure-white);
      border-radius: 3px;
      -webkit-mask:
        linear-gradient(#000 0 0) top left / 8px 8px no-repeat,
        linear-gradient(#000 0 0) top right / 8px 8px no-repeat,
        linear-gradient(#000 0 0) bottom left / 8px 8px no-repeat,
        linear-gradient(#000 0 0) bottom right / 8px 8px no-repeat;
      mask:
        linear-gradient(#000 0 0) top left / 8px 8px no-repeat,
        linear-gradient(#000 0 0) top right / 8px 8px no-repeat,
        linear-gradient(#000 0 0) bottom left / 8px 8px no-repeat,
        linear-gradient(#000 0 0) bottom right / 8px 8px no-repeat;
    }

    .tactical-reticle.is-active {
      width: 48px;
      height: 48px;
    }

    @media (hover: none) {
      .tactical-reticle {
        display: none;
      }
    }

    @media (max-width: 768px) and (orientation: portrait) {
      .hero-title {
        left: 11%;
        top: 27%;
        font-size: 23vw;
      }

      .hero-subtitle {
        left: 12%;
        top: 42%;
        font-size: 7.4vw;
      }

      .kinetic-marquee {
        left: 12%;
        top: 49%;
        width: 68vw;
      }

      .build-status,
      .loop-chevrons {
        display: none;
      }

      .loop-gyro {
        left: 68%;
        top: 62%;
      }

      .brand-angled {
        left: -6%;
        top: 60%;
        font-size: 6.2vw;
      }

      .contact-info {
        left: auto;
        right: 4%;
        top: auto;
        bottom: 13%;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">

    <div class="bg-figma-texture" id="bgTexture"></div>

    <svg

      id="sceneGeo"

        <g class="film-frame hover-target">

          <text class="film-tag" x="967.5" y="-96" text-anchor="middle">04 // CREATIVE</text>
        </g>

        <g class="film-frame hover-target">
          <rect class="film-frame-rect" x="1125" y="-171.5" width="215" height="138" rx="12" fill="#ffffff" />
          <text class="film-tag" x="1232.5" y="-96" text-anchor="middle">05 // W.I.P.</text>
        </g>
      </g>

      <path
        id="bottomRibbon"
        fill="#8cc8e8"
        d="M 352 1024 L 1440 832 L 1440 1024 Z"
      />

      <g id="bottomShards">
        <path
          fill="#ffffff"
          d="
            M 640 1024
            L 640 1012
            Q 640 996 658 992
            L 1018 932
            Q 1044 928 1036 952
            L 1010 1024
            Z
          "
        />
        <path
          fill="#ffffff"
          d="
            M 1032 1024
            L 1064 942
            Q 1076 922 1094 942
            L 1168 1024
            Z
          "
        />
        <path
          fill="#ffffff"
          d="
            M 1192 1024
            L 1116 942
            Q 1100 924 1124 920
            L 1440 866
            L 1440 1024
            Z
          "
        />
      </g>
    </svg>

    <div class="foreground-layer" id="fgLayer">

      <img
        src="assets/logo.svg"
        alt="Kasantara Logo"
        class="asset-logo interactive hover-target gsap-pop"
        id="brandLogo"
      />

      <img
        src="assets/aksara-sunda.svg"
        alt="Aksara Sunda Kasantara"
        class="asset-aksara gsap-pop"
      />

      <div class="brand-angled" id="brandAngled">KASANTARA</div>

      <h1 class="hero-title interactive hover-target" id="heroTitle">
        <span class="hero-char">W</span>

      <div class="kinetic-marquee gsap-pop" aria-hidden="true">

      <div class="build-status gsap-pop" aria-hidden="true">

      <div class="loop-chevrons gsap-pop" aria-hidden="true">

  <script>
    window.addEventListener('DOMContentLoaded', () => {

      gsap.set('#mainBlueShape', { opacity: 0, scale: 0.96, transformOrigin: 'center' });
      gsap.set(['#topRightShape', '#bottomRibbon', '#bottomShards'], { opacity: 0, y: 20 });
      gsap.set('#filmTrack', { x: 475 - 260, y: -176, rotation: 34.05, opacity: 0 });
      gsap.set('.film-frame', { scale: 0.65, opacity: 0 });
      gsap.set('.hero-char', { y: 40, opacity: 0, rotation: -5 });
      gsap.set('#heroSubtitle', { x: -24, opacity: 0 });
      gsap.set('#brandAngled', { x: -30, opacity: 0, rotation: 56 });
      gsap.set('.gsap-pop', { scale: 0.78, opacity: 0 });
      gsap.set('#contactInfo', { y: 16, opacity: 0 });

      const tl = gsap.timeline({ defaults: { ease: 'expo.out' } });

      tl.to('#mainBlueShape', {
        opacity: 1,
        scale: 1,
        duration: 0.9
      })
      .to(['#topRightShape', '#bottomRibbon', '#bottomShards'], {
        opacity: 1,
        y: 0,
        duration: 0.75,
        stagger: 0.08
      }, '-=0.75')
      .to('#filmTrack', {
        x: 475,
        y: 0,
        opacity: 1,
        duration: 0.85,
        ease: 'power4.out'
      }, '-=0.65')
      .to('.film-frame', {
        scale: 1,
        opacity: 1,
        duration: 0.5,
        stagger: 0.06,
        ease: 'back.out(1.8)'
      }, '-=0.45')
      .to('.hero-char', {
        y: 0,
        opacity: 1,
        rotation: 0,
        duration: 0.6,
        stagger: 0.05,
        ease: 'back.out(1.7)'
      }, '-=0.5')
      .to('#heroSubtitle', {
        x: 0,
        opacity: 1,
        duration: 0.6
      }, '-=0.4')
      .to('#brandAngled', {
        x: 0,
        opacity: 1,
        duration: 0.6
      }, '-=0.55')
      .to('.gsap-pop', {
        scale: 1,
        opacity: 1,
        duration: 0.5,
        stagger: 0.08,
        ease: 'back.out(1.6)'
      }, '-=0.45')
      .to('#contactInfo', {
        y: 0,
        opacity: 1,
        duration: 0.5
      }, '-=0.35');

      gsap.to('#marqueeTrack', {
        xPercent: -50,
        duration: 13,
        repeat: -1,
        ease: 'none'
      });

      gsap.to('#loopGyro', {
        rotation: 360,
        duration: 20,
        repeat: -1,
        ease: 'none'
      });

      gsap.to('#gyroInner', {
        rotation: -360,
        transformOrigin: '50% 50%',
        duration: 12,
        repeat: -1,
        ease: 'none'
      });

      gsap.fromTo(
        '.chevron-item',
        { opacity: 0.25, x: -6 },
        {
          opacity: 1,
          x: 6,
          duration: 0.55,
          stagger: 0.12,
          repeat: -1,
          yoyo: true,
          ease: 'power1.inOut'
        }
      );

      gsap.to('.signal-bar', {
        scaleY: () => gsap.utils.random(0.25, 1),
        duration: 0.32,
        stagger: {
          each: 0.08,
          repeat: -1,
          yoyo: true
        },
        ease: 'steps(3)'
      });

      gsap.to('#buildFill', {
        scaleX: 0.94,
        duration: 1.4,
        repeat: -1,
        yoyo: true,
        ease: 'sine.inOut'
      });

      gsap.to('#brandLogo', {
        y: -5,
        duration: 2.2,
        repeat: -1,
        yoyo: true,
        ease: 'sine.inOut'
      });

      document.querySelectorAll('.film-frame').forEach((frame) => {
        frame.addEventListener('mouseenter', () => {
          gsap.to(frame, { scale: 1.06, duration: 0.28, ease: 'back.out(2)' });
        });
        frame.addEventListener('mouseleave', () => {
          gsap.to(frame, { scale: 1, duration: 0.3, ease: 'power2.out' });
        });
      });

      document.getElementById('heroTitle').addEventListener('click', () => {
        gsap.fromTo(
          '.hero-char',
          { y: -16, scale: 1.06 },
          {
            y: 0,
            scale: 1,
            duration: 0.5,
            stagger: 0.04,
            ease: 'elastic.out(1, 0.4)'
          }
        );
      });

      document.getElementById('brandLogo').addEventListener('click', () => {
        gsap.fromTo(
          '#brandLogo',
          { rotation: -14, scale: 0.88 },
          { rotation: 0, scale: 1, duration: 0.55, ease: 'elastic.out(1, 0.35)' }
        );
        gsap.to('.film-frame', {
          scale: 1.08,
          duration: 0.2,
          stagger: { each: 0.06, yoyo: true, repeat: 1 },
          ease: 'power2.inOut'
        });
      });

      const texX = gsap.quickTo('#bgTexture', 'x', { duration: 0.95, ease: 'power3.out' });
      const texY = gsap.quickTo('#bgTexture', 'y', { duration: 0.95, ease: 'power3.out' });
      const geoX = gsap.quickTo('#sceneGeo', 'x', { duration: 0.8, ease: 'power3.out' });
      const geoY = gsap.quickTo('#sceneGeo', 'y', { duration: 0.8, ease: 'power3.out' });
      const fgX = gsap.quickTo('#fgLayer', 'x', { duration: 0.65, ease: 'power3.out' });
      const fgY = gsap.quickTo('#fgLayer', 'y', { duration: 0.65, ease: 'power3.out' });

      const reticle = document.getElementById('reticle');
      const retX = gsap.quickTo(reticle, 'left', { duration: 0.16, ease: 'power2.out' });
      const retY = gsap.quickTo(reticle, 'top', { duration: 0.16, ease: 'power2.out' });

      window.addEventListener('mousemove', (e) => {
        const normX = (e.clientX / window.innerWidth - 0.5) * 2;
        const normY = (e.clientY / window.innerHeight - 0.5) * 2;

        texX(-normX * 6);
        texY(-normY * 5);
        geoX(-normX * 12);
        geoY(-normY * 9);
        fgX(normX * 15);
        fgY(normY * 11);

        reticle.style.opacity = '1';
        retX(e.clientX);
        retY(e.clientY);
      });

      document.querySelectorAll('.hover-target').forEach((el) => {
        el.addEventListener('mouseenter', () => reticle.classList.add('is-active'));
        el.addEventListener('mouseleave', () => reticle.classList.remove('is-active'));
      });
    });
  </script>
</body>
</html>
